[package]
name = "narwhalapi"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
authors = ["Narwhal API Team <support@narwhalapi.com>"]
homepage = "https://narwhalapi.com"
repository = "https://github.com/narwhalapi/narwhalapi-rust"
license = "MIT"
description = "Typed clients for the Narwhal API with exact decimal values"
readme = "README.md"
keywords = ["api", "economics", "fx", "decimal", "sdk"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "CHANGELOG.md"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[features]
default = ["rustls"]
rustls = ["reqwest/rustls-tls"]
native-roots = ["reqwest/rustls-tls-native-roots", "dep:rustls-native-certs", "dep:rustls"]
blocking = ["tokio/rt", "tokio/net"]
rust_decimal = ["dep:rust_decimal"]
unstable = []

[dependencies]
http = "1"
rustls-native-certs = { version = "0.8", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tokio = { version = "1", features = ["time"] }
futures-core = "0.3"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
percent-encoding = "2"
rust_decimal = { version = "1", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "test-util", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.22"
libc = "0.2"
